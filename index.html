<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AWDEA connects disabled adults across British Columbia with free and discounted tickets to concerts, festivals, and sporting events." />
    <!-- Colours the browser chrome on mobile so the page doesn't sit under a
         mismatched bar. -->
    <meta name="theme-color" content="#6d28d9" />

    <!-- Shown when the link is pasted into a message or social post. Without
         these it appears as a bare URL, which reads as spam. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AWDEA — Accessible Entertainment for All" />
    <meta property="og:description" content="Free and discounted tickets to concerts, festivals, and sporting events for disabled adults across British Columbia." />
    <meta property="og:locale" content="en_CA" />
    <!-- TODO(domain move): when the site moves to awdea.org, change og:url,
         og:image and twitter:image below from https://spacewize.github.io/AWDEAAA/
         to https://awdea.org/ (these must stay absolute URLs). -->
    <meta property="og:url" content="https://spacewize.github.io/AWDEAAA/" />
    <meta property="og:image" content="https://spacewize.github.io/AWDEAAA/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AWDEA logo on a purple background with the headline: Entertainment without exclusion. Free and discounted tickets for disabled adults across British Columbia." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://spacewize.github.io/AWDEAAA/og-image.png" />

    <title>AWDEA — Accessible Entertainment for All</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
